name: Generate Weekly Newsletter Edition

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape Weekly Intelligence & Build Edition
        run: |
          python scripts/generate_edition.py
          python scripts/export_html_and_rss.py

      - name: Commit and Push New Edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/editions/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publish weekly newsletter edition [skip ci]" && git push)
